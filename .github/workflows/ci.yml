name: CI

# Everything here runs without a television: the build, the lints, the unit
# and integration tests, and a headless render of the launcher's own frames.
# The parts that need the tube (DRM leasing, the DAC, RetroArch) are checked
# in the living room, and always will be.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Every job here reads the repository and writes nothing back. Saying so
# means the token these jobs are handed cannot do anything else, whatever
# the repository's default happens to be.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: System libraries the crate links against
        run: |
          # The runner's apt index and the mirror it points at can be a
          # few minutes apart, and `apt-get update` then exits 100 on a
          # Release file it considers too new. It is transient, so it is
          # retried rather than allowed to fail a build over it.
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); waiting"
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libudev-dev libinput-dev libxkbcommon-dev \
            libgbm-dev libdrm-dev libseat-dev pkg-config ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: Formatting
        working-directory: shell
        run: cargo fmt --check

      - name: Clippy
        working-directory: shell
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: shell
        run: cargo build --release --all-targets

      - name: Tests
        working-directory: shell
        run: cargo test --release

      - name: The launcher draws its own frames
        working-directory: shell
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          # A headless boot must produce frames that are not a blank screen.
          ./target/release/omacrt-shell --headless \
            --dump 6.0,11.0,12.5 --dump-dir "$RUNNER_TEMP/frames" --no-audio
          ls -l "$RUNNER_TEMP/frames"
          test "$(ls "$RUNNER_TEMP/frames" | wc -l)" -ge 3
          # Not a blank screen: a frame of one flat colour compresses to
          # almost nothing, so a real picture is bigger than that.
          for f in "$RUNNER_TEMP/frames"/*.ppm; do
            size=$(gzip -c "$f" | wc -c)
            echo "$f compresses to $size bytes"
            test "$size" -gt 1500 || { echo "blank frame: $f" >&2; exit 1; }
          done

  shell-scripts:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n over every script
        run: |
          fail=0
          for f in bin/* scripts/*.sh; do
            head -1 "$f" | grep -q bash || continue
            bash -n "$f" || fail=1
          done
          exit $fail
      - name: shellcheck
        run: |
          # The runner's apt index and the mirror it points at can be a
          # few minutes apart, and `apt-get update` then exits 100 on a
          # Release file it considers too new. It is transient, so it is
          # retried rather than allowed to fail a build over it.
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); waiting"
            sleep 15
          done
          sudo apt-get install -y shellcheck
          shellcheck -S warning bin/* scripts/*.sh

  advisories:
    name: no new advisory against a locked crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same database cargo-audit reads, asked over OSV's API, so this
      # needs nothing installed. The two advisories that stand are listed in
      # the script with the reason; anything new fails here.
      - run: python3 scripts/audit.py --list

  qml:
    name: plugin QML parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: qmllint
        run: |
          # The runner's apt index and the mirror it points at can be a
          # few minutes apart, and `apt-get update` then exits 100 on a
          # Release file it considers too new. It is transient, so it is
          # retried rather than allowed to fail a build over it.
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); waiting"
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
          # Advisory, and it says so rather than pretending: the QML here
          # is written against Quickshell and Omarchy's own modules, which
          # cannot be installed on a runner, so every unresolved type
          # produces a warning and qmllint exits non-zero for reasons that
          # have nothing to do with this code. What it still catches, and
          # what this step is for, is a syntax error, which shows up in the
          # output above whatever else it says.
          qmllint plugin/*.qml plugin/library/*.qml || true

  python:
    name: python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m compileall -q scripts
