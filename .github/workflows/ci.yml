name: CI

# Everything here runs without a television: the build, the lints, the unit
# and integration tests, and a headless render of the launcher's own frames.
# The parts that need the tube (DRM leasing, the DAC, RetroArch) are checked
# in the living room, and always will be.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Every job here reads the repository and writes nothing back. Saying so
# means the token these jobs are handed cannot do anything else, whatever
# the repository's default happens to be.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: System libraries the crate links against
        run: |
          # The runner's apt index and the mirror it points at can be a
          # few minutes apart, and `apt-get update` then exits 100 on a
          # Release file it considers too new. It is transient, so it is
          # retried rather than allowed to fail a build over it.
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); waiting"
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libudev-dev libinput-dev libxkbcommon-dev \
            libgbm-dev libdrm-dev libseat-dev pkg-config ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: Formatting
        working-directory: shell
        run: cargo fmt --check

      - name: Clippy
        working-directory: shell
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: shell
        run: cargo build --release --all-targets

      - name: Tests
        working-directory: shell
        run: cargo test --release

      # And again unoptimised, because `debug_assert!` is compiled out of a
      # release build. A contract asserted there is not checked by a release
      # run, so running only that profile means the assertions are decoration:
      # one went in and broke a test that no release run could fail on.
      - name: Tests, with the debug assertions compiled in
        working-directory: shell
        run: cargo test

      - name: A machine that is not Omarchy
        working-directory: .
        # The runner has no Omarchy, no Arch, no graphics card and no
        # television, which is the machine the README makes promises about.
        run: bash scripts/plain-machine.sh

      - name: The launcher draws the frames it drew last time
        working-directory: .
        # Pixel for pixel against the frames kept in the repository, which is
        # the difference between "something was drawn" and "the right thing
        # was drawn": a menu with every label on top of every other passes any
        # test of how much a frame compresses.
        run: scripts/frames-check.sh

  shell-scripts:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n over every script
        run: |
          fail=0
          for f in bin/* scripts/*.sh; do
            head -1 "$f" | grep -q bash || continue
            bash -n "$f" || fail=1
          done
          exit $fail
      - name: shellcheck
        run: |
          # The runner's apt index and the mirror it points at can be a
          # few minutes apart, and `apt-get update` then exits 100 on a
          # Release file it considers too new. It is transient, so it is
          # retried rather than allowed to fail a build over it.
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); waiting"
            sleep 15
          done
          sudo apt-get install -y shellcheck
          shellcheck -S warning bin/* scripts/*.sh

  advisories:
    name: no new advisory against a locked crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same database cargo-audit reads, asked over OSV's API, so this
      # needs nothing installed. The two advisories that stand are listed in
      # the script with the reason; anything new fails here.
      - run: python3 scripts/audit.py --list

  qml:
    name: plugin QML parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: qmllint
        run: |
          # The runner's apt index and the mirror it points at can be a
          # few minutes apart, and `apt-get update` then exits 100 on a
          # Release file it considers too new. It is transient, so it is
          # retried rather than allowed to fail a build over it.
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i); waiting"
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
          # The script keeps the finding that means the same thing with or
          # without Quickshell and Omarchy's modules, which a runner cannot
          # install: the file does not parse. It says how many findings about
          # unresolvable types it set aside, and it fails rather than being
          # advisory, which is what `|| true` here used to make it.
          # The check is verified before it is trusted: it breaks a real
          # plugin file on purpose and requires itself to notice.
          scripts/qml-check.sh --selftest
          scripts/qml-check.sh

  python:
    name: python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m compileall -q scripts

  # The one check `main` is protected by. A branch protection names the
  # contexts it requires, and a context is a job's name, not the workflow's:
  # requiring "CI" while the jobs are called "build, lint and test" and the
  # rest means requiring something that is never reported, and nothing can be
  # merged. This job is that name, and it passes only when every job above
  # did, so adding a job to the workflow does not quietly stop being required.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [rust, shell-scripts, advisories, qml, python]
    if: always()
    steps:
      - name: every job above succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "a job above did not succeed" >&2
          exit 1
