<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-label="The vertical blanking stretched at a constant line rate: the picture keeps its height down to 55 Hz and loses an eighth of it at 50"><style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.t { font-family: JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace; }
@keyframes pic {
