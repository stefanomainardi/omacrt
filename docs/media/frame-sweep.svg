<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-label="One frame swept twice: at a variable refresh the commit is queued at once, at a fixed one it waits for the deadline"><rect width="920" height="340" fill="#0b0d14"/><text class="t" x="40" y="34" font-size="12" font-weight="700" fill="#c0caf5" text-anchor="start">ONE FRAME, 16.655 ms, SWEPT TWICE</text><text class="t" x="40" y="52" font-size="10.5" font-weight="400" fill="#565f89" text-anchor="start">same client, drawing one millisecond, launcher mapped underneath</text><text class="t" x="40" y="114" font-size="12" font-weight="700" fill="#9ece6a" text-anchor="start">variable rate</text><text class="t" x="40" y="130" font-size="10" font-weight="400" fill="#565f89" text-anchor="start">no deadline</text><rect x="150" y="84" width="720" height="56" fill="#11141f" stroke="#1f2335"/><rect id="span0" x="761.71" y="124" width="108.29" height="8" fill="#ff9e64" opacity="0.85"/><text class="t" x="864.0" y="118" font-size="10.5" font-weight="700" fill="#ff9e64" text-anchor="end">2.50 ms to scanout</text><g id="m00"><path d="M150.00 78 V146" stroke="#c0caf5" stroke-width="1.4"/><text class="t" x="154.0" y="160" font-size="9.5" font-weight="500" fill="#c0caf5" text-anchor="start">vblank</text></g><g id="m013100"><path d="M716.32 78 V168" stroke="#565f89" stroke-width="1.4" stroke-dasharray="3 3"/><text class="t" x="716.3164214950465" y="182" font-size="9.5" font-weight="500" fill="#565f89" text-anchor="middle">callbacks</text></g><g id="m014150"><path d="M761.71 78 V146" stroke="#ff9e64" stroke-width="1.4" stroke-dasharray="3 3"/><text class="t" x="761.7081957370159" y="160" font-size="9.5" font-weight="500" fill="#ff9e64" text-anchor="middle">commit</text></g><g id="m016655"><path d="M870.00 78 V168" stroke="#c0caf5" stroke-width="1.4"/><text class="t" x="866.0" y="182" font-size="9.5" font-weight="500" fill="#c0caf5" text-anchor="end">scanout</text></g><g class="head"><path d="M150 74 V150" stroke="#f7768e" stroke-width="1.6" opacity="0.9"/></g><text class="t" x="40" y="244" font-size="12" font-weight="700" fill="#7aa2f7" text-anchor="start">fixed rate</text><text class="t" x="40" y="260" font-size="10" font-weight="400" fill="#565f89" text-anchor="start">a deadline</text><rect x="150" y="214" width="720" height="56" fill="#11141f" stroke="#1f2335"/><rect id="span1" x="560.69" y="254" width="309.31" height="8" fill="#ff9e64" opacity="0.85"/><text class="t" x="864.0" y="248" font-size="10.5" font-weight="700" fill="#ff9e64" text-anchor="end">7.16 ms to scanout</text><g id="m10"><path d="M150.00 208 V276" stroke="#c0caf5" stroke-width="1.4"/><text class="t" x="154.0" y="290" font-size="9.5" font-weight="500" fill="#c0caf5" text-anchor="start">vblank</text></g><g id="m18400"><path d="M513.13 208 V298" stroke="#565f89" stroke-width="1.4" stroke-dasharray="3 3"/><text class="t" x="513.1341939357551" y="312" font-size="9.5" font-weight="500" fill="#565f89" text-anchor="middle">callbacks</text></g><g id="m19500"><path d="M560.69 208 V276" stroke="#ff9e64" stroke-width="1.4" stroke-dasharray="3 3"/><text class="t" x="560.6874812368658" y="290" font-size="9.5" font-weight="500" fill="#ff9e64" text-anchor="middle">commit</text></g><g id="m113644"><path d="M739.83 208 V298" stroke="#7aa2f7" stroke-width="1.4"/><text class="t" x="739.833683578505" y="312" font-size="9.5" font-weight="500" fill="#7aa2f7" text-anchor="middle">queued</text></g><g id="m116655"><path d="M870.00 208 V276" stroke="#c0caf5" stroke-width="1.4"/><text class="t" x="866.0" y="290" font-size="9.5" font-weight="500" fill="#c0caf5" text-anchor="end">scanout</text></g><g class="head"><path d="M150 204 V280" stroke="#f7768e" stroke-width="1.6" opacity="0.9"/></g><text class="t" x="40" y="320" font-size="10" font-weight="400" fill="#565f89" text-anchor="start">Solid marks are measured; the dashed ones are arithmetic from the scheduler's own estimates. Under a variable rate the flip is queued 75 microseconds after the commit, which is three pixels here.</text><style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
