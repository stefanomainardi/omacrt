<svg width="976" height="500" viewBox="0 0 976 500" xmlns="http://www.w3.org/2000/svg"><rect width="976" height="500" fill="#0b0d14"/><defs><marker id="head-565f89" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#565f89"/></marker><marker id="head-9ece6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9ece6a"/></marker><marker id="head-7aa2f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7aa2f7"/></marker><marker id="head-7dcfff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7dcfff"/></marker></defs><rect x="0" y="20" width="178" height="100" rx="0" fill="#11141f" stroke="#1f2335" stroke-width="1"/><text x="14" y="44" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="13" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">Hyprland</text><text x="14" y="64" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">the desktop session</text><text x="14" y="80" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">offers the connector it</text><text x="14" y="96" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">was told to leave alone</text><rect x="0" y="140" width="178" height="75" rx="0" fill="#11141f" stroke="#1f2335" stroke-width="1"/><text x="14" y="164" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="13" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">omacrt</text><text x="14" y="184" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">the CLI and the bar plugin</text><text x="14" y="200" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">on the desktop side</text><rect x="0" y="245" width="178" height="225" rx="0" fill="none" stroke="#1f2335" stroke-width="1"/><text x="14" y="266" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#9aa5ce" text-anchor="start" letter-spacing="1.4">THE CLIENTS</text><rect x="14" y="280" width="150" height="50" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="26" y="301" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="12" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">omacrt-shell</text><text x="26" y="318" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">the launcher, 320x240</text><rect x="14" y="342" width="150" height="50" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="26" y="363" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="12" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">RetroArch</text><text x="26" y="380" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">a core per system</text><rect x="14" y="404" width="150" height="50" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="26" y="425" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="12" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">mpv</text><text x="26" y="442" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">films and YouTube</text><rect x="300" y="0" width="316" height="480" rx="0" fill="#11141f" stroke="#9ece6a" stroke-width="1"/><text x="320" y="32" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="21" font-weight="800" fill="#9ece6a" text-anchor="start" letter-spacing="0">Flyback</text><text x="320" y="51" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">one process, one thread, one calloop loop</text><rect x="318" y="74" width="280" height="61" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="330" y="93" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">lease.rs</text><text x="330" y="109" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">takes the lease: a DRM fd that is master for</text><text x="330" y="123" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">one connector and its CRTC, and nothing else</text><rect x="318" y="143" width="280" height="75" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="330" y="162" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">the Wayland side</text><text x="330" y="178" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">wl_compositor  wl_subcompositor  xdg_shell</text><text x="330" y="192" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">wl_shm  zwp_linux_dmabuf  wp_viewporter</text><text x="330" y="206" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">wp_presentation  wl_seat: keyboard only</text><rect x="318" y="226" width="280" height="89" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="330" y="245" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">the scheduler</text><text x="330" y="261" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">when to tell the clients, when to draw, when</text><text x="330" y="275" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">to flip. fixed: draw at the deadline less</text><text x="330" y="289" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">render_cost. variable: no deadline, draw the</text><text x="330" y="303" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">moment a client commits</text><rect x="318" y="323" width="280" height="61" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="330" y="342" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">the DRM output</text><text x="330" y="358" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">atomic commit, and no timing reaches it</text><text x="330" y="372" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">without passing Modeline::fault</text><rect x="318" y="392" width="280" height="61" rx="0" fill="#0b0d14" stroke="#1f2335" stroke-width="1"/><text x="330" y="411" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">the control pipe</text><text x="330" y="427" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">0600 in the user's own state folder</text><text x="330" y="441" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">top key mode vrr rate shot record</text><rect x="726" y="20" width="240" height="97" rx="0" fill="#11141f" stroke="#1f2335" stroke-width="1"/><text x="740" y="44" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="13" font-weight="700" fill="#7aa2f7" text-anchor="start" letter-spacing="0">amdgpu / DRM</text><text x="740" y="64" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">atomic modeset on the leased fd</text><text x="740" y="80" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">page flip, and a vblank</text><text x="740" y="96" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">timestamp on CLOCK_MONOTONIC</text><text x="740" y="112" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">adaptive sync on the CRTC</text><rect x="726" y="200" width="240" height="69" rx="0" fill="#11141f" stroke="#1f2335" stroke-width="1"/><text x="740" y="224" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="13" font-weight="700" fill="#7dcfff" text-anchor="start" letter-spacing="0">RGB-Pi 2</text><text x="740" y="244" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">HDMI in, RGB SCART out</text><text x="740" y="260" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">composite sync over I2C</text><rect x="726" y="355" width="240" height="83" rx="0" fill="#11141f" stroke="#1f2335" stroke-width="1"/><text x="740" y="379" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="13" font-weight="700" fill="#c0caf5" text-anchor="start" letter-spacing="0">CRT television</text><text x="740" y="399" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">15.731 kHz, 240 lines, 60.04 Hz</text><text x="740" y="415" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">no panel, no scaler, no buffer:</text><text x="740" y="431" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10.5" font-weight="400" fill="#9aa5ce" text-anchor="start" letter-spacing="0">the photon leaves when it arrives</text><path d="M178 70 L298 70" fill="none" stroke="#9ece6a" stroke-width="1.4" marker-end="url(#head-9ece6a)"/><text x="239.0" y="62" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#9ece6a" text-anchor="middle" letter-spacing="0.4">wp_drm_lease_v1</text><path d="M178 178 L298 178" fill="none" stroke="#565f89" stroke-width="1.4" marker-end="url(#head-565f89)"/><text x="239.0" y="170" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#9aa5ce" text-anchor="middle" letter-spacing="0.4">control pipe</text><path d="M178 330 L298 330" fill="none" stroke="#565f89" stroke-width="1.4" marker-end="url(#head-565f89)"/><text x="239.0" y="322" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#9aa5ce" text-anchor="middle" letter-spacing="0.4">wayland-crt</text><path d="M298 420 L180 420" fill="none" stroke="#565f89" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-565f89)"/><text x="239.0" y="412" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#9aa5ce" text-anchor="middle" letter-spacing="0.4">frame callbacks</text><path d="M616 70 L724 70" fill="none" stroke="#7aa2f7" stroke-width="1.4" marker-end="url(#head-7aa2f7)"/><text x="671.0" y="62" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#7aa2f7" text-anchor="middle" letter-spacing="0.4">atomic commit</text><path d="M724 120 L618 120" fill="none" stroke="#7aa2f7" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-7aa2f7)"/><text x="671.0" y="112" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#7aa2f7" text-anchor="middle" letter-spacing="0.4">vblank</text><path d="M846.0 140 L846.0 198" fill="none" stroke="#7dcfff" stroke-width="1.4" marker-end="url(#head-7dcfff)"/><text x="858.0" y="175" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#7dcfff" text-anchor="start" letter-spacing="0">HDMI</text><path d="M846.0 295 L846.0 353" fill="none" stroke="#7dcfff" stroke-width="1.4" marker-end="url(#head-7dcfff)"/><text x="858.0" y="330" font-family="JetBrains Mono, JetBrainsMono Nerd Font, ui-monospace, monospace" font-size="10" font-weight="500" fill="#7dcfff" text-anchor="start" letter-spacing="0">RGB SCART</text></svg>