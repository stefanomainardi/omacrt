[package]
name = "omacrt-shell"
version = "0.4.0"
edition = "2024"

[dependencies]
calloop-wayland-source = "0.4.1"
chrono = "0.4"
drm = "0.14"
drm-ffi = "0.9"
libc = "0.2"
png = "0.18"
sdl2 = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7", default-features = false, features = ["backend_drm", "backend_gbm", "backend_egl", "renderer_gl", "wayland_frontend", "desktop", "use_system_lib"] }
toml = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
# The builds people run are release builds, and without this an arithmetic
# overflow wraps in silence: `len() - 1` on an empty list becomes a very large
# number and the panic lands one line later at the index, or does not land at
# all and something is drawn wrong. A television that stops has to stop where
# the mistake is. The cost is a few instructions on paths that are already
# doing far more than arithmetic.
overflow-checks = true

[lints.clippy]
# The lint is on. Four drawing routines take a rectangle, a level and a phase
# and say so with an allowance of their own, where the argument list *is* the
# geometry; anything new has to earn the same.
