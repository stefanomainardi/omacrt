[package]
name = "omarchy-crt-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
drm = "0.15"
drm-ffi = "0.9"
libc = "0.2"
png = "0.17"
sdl2 = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
